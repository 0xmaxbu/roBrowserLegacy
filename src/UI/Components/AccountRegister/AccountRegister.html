<div id="AccountRegister">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="dot" data-background="login_interface/login_dot.png"></div>
		<span class="text">注册新账号</span>
		<button
			class="close"
			type="button"
			data-background="basic_interface/sys_close_off.bmp"
			data-hover="basic_interface/sys_close_on.bmp"
		></button>
	</div>
	<div class="form">
		<div class="row hinted">
			<label>帐 号</label>
			<input name="username" maxlength="23" autocomplete="off" spellcheck="false" />
			<div class="note">仅限字母和数字（4-23 位）</div>
		</div>
		<div class="row hinted">
			<label>邮 箱</label>
			<input name="email" maxlength="39" autocomplete="off" spellcheck="false" />
			<div class="note">一个邮箱仅可注册一个账号</div>
		</div>
		<div class="row hinted">
			<label>密 码</label>
			<input name="password" type="password" maxlength="23" />
			<div class="note">6-23 位</div>
		</div>
		<div class="row">
			<label>确认密码</label>
			<input name="password2" type="password" maxlength="23" />
		</div>
		<div class="row">
			<label>性 别</label>
			<div class="sex">
				<button
					class="sexbtn male active"
					type="button"
					data-background="login_interface/checkbox_off.bmp"
					data-active="login_interface/checkbox_on.bmp"
				></button><span>男</span>
				<button
					class="sexbtn female"
					type="button"
					data-background="login_interface/checkbox_off.bmp"
					data-active="login_interface/checkbox_on.bmp"
				></button><span>女</span>
			</div>
		</div>
		<div class="row">
			<label>验证码</label>
			<div class="codewrap">
				<input name="code" maxlength="6" autocomplete="off" spellcheck="false" />
				<button class="send" type="button">获取</button>
			</div>
		</div>
	</div>
	<div class="msg"></div>
	<div class="footer" data-background="basic_interface/btnbar_mid2.bmp">
		<button
			class="register"
			type="button"
			data-background="login_interface/btn_request.bmp"
			data-hover="login_interface/btn_request_a.bmp"
			data-down="login_interface/btn_request_b.bmp"
		></button>
		<button
			class="cancel"
			type="button"
			data-background="login_interface/btn_exit.bmp"
			data-hover="login_interface/btn_exit_a.bmp"
			data-down="login_interface/btn_exit_b.bmp"
		></button>
	</div>
</div>
