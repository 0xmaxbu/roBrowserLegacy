<div id="AccountRegister">
	<div class="titlebar">注册新账号</div>
	<div class="form">
		<div class="row">
			<label>帐 号</label>
			<input name="username" maxlength="23" autocomplete="off" spellcheck="false" />
		</div>
		<div class="row">
			<label>邮 箱</label>
			<input name="email" maxlength="39" autocomplete="off" spellcheck="false" />
		</div>
		<div class="row">
			<label>密 码</label>
			<input name="password" type="password" maxlength="23" />
		</div>
		<div class="row">
			<label>确认密码</label>
			<input name="password2" type="password" maxlength="23" />
		</div>
		<div class="row">
			<label>性 别</label>
			<div class="sex">
				<button class="sexbtn male active" type="button">男 性</button>
				<button class="sexbtn female" type="button">女 性</button>
			</div>
		</div>
		<div class="row">
			<label>验证码</label>
			<input name="code" maxlength="6" autocomplete="off" spellcheck="false" />
			<button class="send" type="button">发送验证码</button>
		</div>
	</div>
	<div class="msg"></div>
	<div class="btns">
		<button class="register" type="button">注 册</button>
		<button class="cancel" type="button">取 消</button>
	</div>
	<div class="hint">帐号仅限字母和数字（4-23 位），一个邮箱只能注册一个账号</div>
</div>
